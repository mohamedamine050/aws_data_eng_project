<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 900" width="1560" height="900"
     font-family="Segoe UI, Helvetica Neue, Helvetica, Arial, sans-serif" role="img"
     aria-label="Architecture AWS du pipeline e-commerce : deux sources alimentent SQS et deux Lambda qui déposent les événements dans un lac S3 ; cinq jobs AWS Glue ingèrent les fichiers, transforment bronze en silver, auditent la qualité, construisent le gold et chargent PostgreSQL, le tout orchestré par Step Functions et supervisé par CloudWatch.">

  <defs>
    <linearGradient id="gCompute" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFAB4A"/><stop offset="100%" stop-color="#E7700D"/>
    </linearGradient>
    <linearGradient id="gIntegration" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FF5CA8"/><stop offset="100%" stop-color="#D6156C"/>
    </linearGradient>
    <linearGradient id="gStorage" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#A3CE39"/><stop offset="100%" stop-color="#5E8A16"/>
    </linearGradient>
    <linearGradient id="gAnalytics" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#B78AFF"/><stop offset="100%" stop-color="#7A29FF"/>
    </linearGradient>
    <linearGradient id="gDatabase" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5A7BFF"/><stop offset="100%" stop-color="#2B41D8"/>
    </linearGradient>

    <marker id="arrow" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="8" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#42505E"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#8A97A4"/>
    </marker>
    <marker id="arrowRed" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="8" markerHeight="7" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#C7402C"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 8" refX="9" refY="4" markerWidth="9" markerHeight="8" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#7A29FF"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1560" height="900" fill="#FFFFFF"/>

  <text x="28" y="34" font-size="18" font-weight="700" fill="#16202B">E-commerce lakehouse — architecture AWS</text>
  <text x="28" y="54" font-size="12.5" fill="#68767F">2 sources · lac S3 en médaillon · 5 jobs Glue, chacun avec son entrée et sa sortie · entrepôt PostgreSQL</text>

  <!-- ═════════════ BANDE 1 — INGESTION ═════════════ -->
  <text x="28" y="92" font-size="11.5" font-weight="700" fill="#8A97A4" letter-spacing="1.6">INGESTION</text>

  <!-- EventBridge -->
  <rect x="264" y="24" width="72" height="72" rx="14" fill="url(#gIntegration)"/>
  <g stroke="#FFFFFF" stroke-width="2.2" fill="none" stroke-linecap="round">
    <circle cx="300" cy="60" r="7" fill="#FFFFFF" stroke="none"/>
    <path d="M300 42 v8 M300 70 v8 M282 60 h8 M310 60 h8"/>
    <path d="M287 47 l6 6 M313 73 l-6 -6 M313 47 l-6 6 M287 73 l6 -6"/>
  </g>
  <text x="300" y="116" font-size="12.5" font-weight="600" fill="#16202B" text-anchor="middle">Amazon EventBridge</text>
  <text x="300" y="132" font-size="11" fill="#68767F" text-anchor="middle">déclenche toutes les 5 min</text>

  <!-- ① source card -->
  <rect x="30" y="152" width="156" height="84" rx="8" fill="#FFFFFF" stroke="#B9C4CE" stroke-width="1.4"/>
  <circle cx="108" cy="174" r="13" fill="none" stroke="#42505E" stroke-width="1.8"/>
  <path d="M95 174 h26 M108 161 c6.5 6 6.5 20 0 26 c-6.5 -6 -6.5 -20 0 -26" fill="none" stroke="#42505E" stroke-width="1.4"/>
  <text x="108" y="209" font-size="13" font-weight="600" fill="#16202B" text-anchor="middle">REST API</text>
  <text x="108" y="226" font-size="11" fill="#68767F" text-anchor="middle">① catalogue produits</text>

  <!-- ② source card -->
  <rect x="30" y="292" width="156" height="84" rx="8" fill="#FFFFFF" stroke="#B9C4CE" stroke-width="1.4"/>
  <g stroke="#42505E" stroke-width="1.5" fill="#FFFFFF">
    <path d="M96 302 h18 l7 7 v22 h-25 z"/>
    <path d="M104 309 h18 l7 7 v22 h-25 z" fill="#EEF2F5"/>
  </g>
  <text x="108" y="352" font-size="12" font-weight="600" fill="#16202B" text-anchor="middle">CSV / JSON / NDJSON</text>
  <text x="108" y="368" font-size="11" fill="#68767F" text-anchor="middle">② dépôts partenaires</text>

  <!-- Lambda producer -->
  <rect x="264" y="158" width="72" height="72" rx="14" fill="url(#gCompute)"/>
  <path d="M286 216 l16 -34 h8 l16 34 h-11 l-9 -21 l-9 21 z" fill="#FFFFFF"/>
  <text x="300" y="252" font-size="13.5" font-weight="600" fill="#16202B" text-anchor="middle">AWS Lambda</text>
  <text x="300" y="268" font-size="11" fill="#68767F" text-anchor="middle">producer · sessions</text>

  <!-- SQS -->
  <rect x="454" y="158" width="72" height="72" rx="14" fill="url(#gIntegration)"/>
  <g fill="#FFFFFF">
    <rect x="472" y="176" width="36" height="8" rx="3"/>
    <rect x="472" y="190" width="36" height="8" rx="3"/>
    <rect x="472" y="204" width="36" height="8" rx="3"/>
  </g>
  <text x="490" y="252" font-size="13.5" font-weight="600" fill="#16202B" text-anchor="middle">Amazon SQS</text>
  <text x="490" y="268" font-size="11" fill="#68767F" text-anchor="middle">file d'attente + DLQ</text>

  <!-- landing folder -->
  <path d="M530 310 h20 l6 7 h34 v41 h-60 z" fill="#EFF3F6" stroke="#8A97A4" stroke-width="1.4"/>
  <path d="M530 322 h60" stroke="#8A97A4" stroke-width="1"/>
  <text x="560" y="374" font-size="11.5" font-weight="600" fill="#42505E" text-anchor="middle">landing/</text>

  <!-- Lambda stream processor -->
  <rect x="644" y="158" width="72" height="72" rx="14" fill="url(#gCompute)"/>
  <path d="M666 216 l16 -34 h8 l16 34 h-11 l-9 -21 l-9 21 z" fill="#FFFFFF"/>
  <text x="680" y="252" font-size="13.5" font-weight="600" fill="#16202B" text-anchor="middle">AWS Lambda</text>
  <text x="680" y="268" font-size="11" fill="#68767F" text-anchor="middle">stream processor</text>
  <text x="680" y="283" font-size="11" fill="#68767F" text-anchor="middle">valide · dédoublonne</text>

  <!-- S3 -->
  <rect x="844" y="158" width="72" height="72" rx="14" fill="url(#gStorage)"/>
  <path d="M864 180 h32 l-4 30 h-24 z" fill="#FFFFFF"/>
  <ellipse cx="880" cy="180" rx="16" ry="5.5" fill="#E8F3CE"/>
  <text x="880" y="252" font-size="13.5" font-weight="600" fill="#16202B" text-anchor="middle">Amazon S3</text>
  <text x="880" y="268" font-size="11" fill="#68767F" text-anchor="middle">lac de données</text>

  <!-- Step Functions -->
  <rect x="1094" y="158" width="72" height="72" rx="14" fill="url(#gIntegration)"/>
  <g fill="#FFFFFF">
    <rect x="1110" y="172" width="16" height="14" rx="3"/>
    <rect x="1134" y="172" width="16" height="14" rx="3"/>
    <rect x="1122" y="202" width="16" height="14" rx="3"/>
  </g>
  <g stroke="#FFFFFF" stroke-width="1.8" fill="none">
    <path d="M1126 179 h8"/><path d="M1118 186 v10 h12"/><path d="M1142 186 v10 h-12"/>
  </g>
  <text x="1130" y="252" font-size="13.5" font-weight="600" fill="#16202B" text-anchor="middle">AWS Step Functions</text>
  <text x="1130" y="268" font-size="11" fill="#68767F" text-anchor="middle">enchaîne les 5 jobs</text>
  <text x="1130" y="283" font-size="11" fill="#68767F" text-anchor="middle">1 → 2 → 3 → 4 → 5, une fois/jour</text>

  <!-- flow, band 1 -->
  <g fill="none" stroke="#42505E" stroke-width="2" marker-end="url(#arrow)">
    <line x1="300" y1="96" x2="300" y2="152"/>
    <line x1="186" y1="194" x2="258" y2="194"/>
    <line x1="336" y1="194" x2="448" y2="194"/>
    <line x1="526" y1="194" x2="638" y2="194"/>
    <line x1="716" y1="194" x2="838" y2="194"/>
    <line x1="186" y1="334" x2="524" y2="334"/>
  </g>
  <text x="392" y="186" font-size="10.5" fill="#68767F" text-anchor="middle">SendMessageBatch</text>
  <text x="582" y="186" font-size="10.5" fill="#68767F" text-anchor="middle">lots de 10</text>
  <text x="777" y="186" font-size="10.5" fill="#68767F" text-anchor="middle">NDJSON</text>
  <text x="222" y="326" font-size="10.5" fill="#68767F">dépose un fichier</text>


  <!-- Glue job 1 — les dépôts partenaires -->
  <g transform="translate(760,346)">
    <rect x="-36" y="-36" width="72" height="72" rx="14" fill="url(#gAnalytics)"/>
    <g stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round">
      <circle cx="0" cy="0" r="11"/>
      <path d="M0 -18 v-5 M0 23 v-5 M-18 0 h-5 M23 0 h-5"/>
      <path d="M-13 -13 l-4 -4 M13 13 l4 4 M13 -13 l4 -4 M-13 13 l-4 4"/>
    </g>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>
  <text x="806" y="336" font-size="13.5" font-weight="600" fill="#16202B">AWS Glue</text>
  <text x="806" y="352" font-size="11" font-weight="700" fill="#7A29FF">job 1 — dépôts → bronze</text>
  <text x="806" y="367" font-size="11" fill="#68767F">aplatit le CSV · archive le fichier</text>

  <g fill="none" stroke="#42505E" stroke-width="2" marker-end="url(#arrow)">
    <line x1="590" y1="346" x2="718" y2="346"/>
    <line x1="760" y1="382" x2="760" y2="414"/>
  </g>

  <!-- S3 down into the medallion band -->
  <g fill="none" stroke="#42505E" stroke-width="2" marker-end="url(#arrow)">
    <polyline points="880,236 880,420 120,420 120,486"/>
  </g>
  <text x="500" y="412" font-size="10.5" fill="#68767F" text-anchor="middle">écrit dans bronze/events/, partitionné sur le temps de l'événement</text>

  <!-- ═════════════ BANDE 2 — MÉDAILLON + LES 4 JOBS GLUE ═════════════ -->
  <text x="28" y="460" font-size="11.5" font-weight="700" fill="#8A97A4" letter-spacing="1.6">MÉDAILLON — CHAQUE JOB GLUE, SON ENTRÉE ET SA SORTIE</text>

  <!-- bronze -->
  <path d="M90 492 h20 l6 7 h34 v41 h-60 z" fill="#F5E6D6" stroke="#A9682F" stroke-width="1.6"/>
  <path d="M90 504 h60" stroke="#A9682F" stroke-width="1"/>
  <text x="120" y="576" font-size="13.5" font-weight="700" fill="#A9682F" text-anchor="middle">bronze/</text>
  <text x="120" y="592" font-size="11" fill="#68767F" text-anchor="middle">brut, append-only</text>

  <!-- job 1 -->
  <g transform="translate(300,516)">
    <rect x="-36" y="-36" width="72" height="72" rx="14" fill="url(#gAnalytics)"/>
    <g stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round">
      <circle cx="0" cy="0" r="11"/>
      <path d="M0 -18 v-5 M0 23 v-5 M-18 0 h-5 M23 0 h-5"/>
      <path d="M-13 -13 l-4 -4 M13 13 l4 4 M13 -13 l4 -4 M-13 13 l-4 4"/>
    </g>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>
  <text x="300" y="576" font-size="13.5" font-weight="600" fill="#16202B" text-anchor="middle">AWS Glue</text>
  <text x="300" y="592" font-size="11" font-weight="700" fill="#7A29FF" text-anchor="middle">job 2 — bronze → silver</text>
  <text x="300" y="607" font-size="11" fill="#68767F" text-anchor="middle">aplatit · nettoie · dédoublonne</text>

  <!-- silver -->
  <path d="M450 492 h20 l6 7 h34 v41 h-60 z" fill="#E9EDF0" stroke="#6E7C88" stroke-width="1.6"/>
  <path d="M450 504 h60" stroke="#6E7C88" stroke-width="1"/>
  <text x="480" y="576" font-size="13.5" font-weight="700" fill="#5A6772" text-anchor="middle">silver/</text>
  <text x="480" y="592" font-size="11" fill="#68767F" text-anchor="middle">41 colonnes typées</text>

  <!-- job 3 -->
  <g transform="translate(660,516)">
    <rect x="-36" y="-36" width="72" height="72" rx="14" fill="url(#gAnalytics)"/>
    <g stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round">
      <circle cx="0" cy="0" r="11"/>
      <path d="M0 -18 v-5 M0 23 v-5 M-18 0 h-5 M23 0 h-5"/>
      <path d="M-13 -13 l-4 -4 M13 13 l4 4 M13 -13 l4 -4 M-13 13 l-4 4"/>
    </g>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>
  <text x="660" y="576" font-size="13.5" font-weight="600" fill="#16202B" text-anchor="middle">AWS Glue</text>
  <text x="660" y="592" font-size="11" font-weight="700" fill="#7A29FF" text-anchor="middle">job 4 — silver → gold</text>
  <text x="660" y="607" font-size="11" fill="#68767F" text-anchor="middle">agrège les 6 tables</text>

  <!-- gold -->
  <path d="M810 492 h20 l6 7 h34 v41 h-60 z" fill="#F8EFD2" stroke="#BE9420" stroke-width="1.6"/>
  <path d="M810 504 h60" stroke="#BE9420" stroke-width="1"/>
  <text x="840" y="576" font-size="13.5" font-weight="700" fill="#96760F" text-anchor="middle">gold/</text>
  <text x="840" y="592" font-size="11" fill="#68767F" text-anchor="middle">6 tables métier</text>

  <!-- job 4 -->
  <g transform="translate(1020,516)">
    <rect x="-36" y="-36" width="72" height="72" rx="14" fill="url(#gAnalytics)"/>
    <g stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round">
      <circle cx="0" cy="0" r="11"/>
      <path d="M0 -18 v-5 M0 23 v-5 M-18 0 h-5 M23 0 h-5"/>
      <path d="M-13 -13 l-4 -4 M13 13 l4 4 M13 -13 l4 -4 M-13 13 l-4 4"/>
    </g>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>
  <text x="1020" y="576" font-size="13.5" font-weight="600" fill="#16202B" text-anchor="middle">AWS Glue</text>
  <text x="1020" y="592" font-size="11" font-weight="700" fill="#7A29FF" text-anchor="middle">job 5 — lac → entrepôt</text>
  <text x="1020" y="607" font-size="11" fill="#68767F" text-anchor="middle">7 tables, une passe JDBC</text>

  <!-- RDS -->
  <rect x="1174" y="480" width="72" height="72" rx="14" fill="url(#gDatabase)"/>
  <path d="M1192 504 a18 6 0 0 1 36 0 v24 a18 6 0 0 1 -36 0 z" fill="#FFFFFF" opacity=".92"/>
  <ellipse cx="1210" cy="504" rx="18" ry="6" fill="#DCE4FF"/>
  <text x="1210" y="576" font-size="13.5" font-weight="600" fill="#16202B" text-anchor="middle">Amazon RDS</text>
  <text x="1210" y="592" font-size="11" fill="#68767F" text-anchor="middle">PostgreSQL · entrepôt</text>

  <!-- Athena -->
  <rect x="1364" y="480" width="72" height="72" rx="14" fill="url(#gAnalytics)"/>
  <g stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round">
    <circle cx="1394" cy="508" r="12"/>
    <path d="M1403 517 l10 10"/>
  </g>
  <g fill="#FFFFFF">
    <rect x="1382" y="530" width="6" height="10" rx="1.5"/>
    <rect x="1393" y="524" width="6" height="16" rx="1.5"/>
    <rect x="1404" y="528" width="6" height="12" rx="1.5"/>
  </g>
  <text x="1400" y="576" font-size="13.5" font-weight="600" fill="#16202B" text-anchor="middle">Amazon Athena</text>
  <text x="1400" y="592" font-size="11" fill="#68767F" text-anchor="middle">SQL direct sur le lac</text>

  <!-- band 2 flow: each job between its input and its output -->
  <g fill="none" stroke="#42505E" stroke-width="2.2" marker-end="url(#arrow)">
    <line x1="150" y1="516" x2="258" y2="516"/>
    <line x1="336" y1="516" x2="444" y2="516"/>
    <line x1="510" y1="516" x2="618" y2="516"/>
    <line x1="696" y1="516" x2="804" y2="516"/>
    <line x1="870" y1="516" x2="978" y2="516"/>
    <line x1="1056" y1="516" x2="1168" y2="516"/>
    <line x1="1246" y1="516" x2="1358" y2="516"/>
  </g>
  <text x="1112" y="508" font-size="10.5" fill="#68767F" text-anchor="middle">JDBC</text>

  <!-- job 4 also reads silver -->
  <g fill="none" stroke="#42505E" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#arrow)">
    <polyline points="480,486 480,448 1020,448 1020,476"/>
  </g>
  <text x="750" y="440" font-size="10.5" fill="#68767F" text-anchor="middle">le job 5 charge aussi silver → analytics.fact_events</text>

  <!-- ═════════════ JOB 2 — LE CONTRÔLE QUALITÉ ═════════════ -->
  <g transform="translate(480,716)">
    <rect x="-36" y="-36" width="72" height="72" rx="14" fill="url(#gAnalytics)"/>
    <g stroke="#FFFFFF" stroke-width="3" fill="none" stroke-linecap="round">
      <circle cx="0" cy="0" r="11"/>
      <path d="M0 -18 v-5 M0 23 v-5 M-18 0 h-5 M23 0 h-5"/>
      <path d="M-13 -13 l-4 -4 M13 13 l4 4 M13 -13 l4 -4 M-13 13 l-4 4"/>
    </g>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>
  <text x="480" y="776" font-size="13.5" font-weight="600" fill="#16202B" text-anchor="middle">AWS Glue</text>
  <text x="480" y="792" font-size="11" font-weight="700" fill="#7A29FF" text-anchor="middle">job 3 — audit du lot</text>
  <text x="480" y="807" font-size="11" fill="#68767F" text-anchor="middle">12 contrôles, un seul passage</text>

  <!-- quarantine -->
  <path d="M650 664 h20 l6 7 h34 v41 h-60 z" fill="#F7E2DE" stroke="#C7402C" stroke-width="1.5"/>
  <path d="M650 676 h60" stroke="#C7402C" stroke-width="1"/>
  <text x="680" y="728" font-size="11.5" font-weight="700" fill="#C7402C" text-anchor="middle">quarantine/</text>
  <text x="680" y="743" font-size="10.5" fill="#68767F" text-anchor="middle">lignes + règles violées</text>

  <!-- quality -->
  <path d="M650 780 h20 l6 7 h34 v41 h-60 z" fill="#EFF3F6" stroke="#8A97A4" stroke-width="1.5"/>
  <path d="M650 792 h60" stroke="#8A97A4" stroke-width="1"/>
  <text x="680" y="844" font-size="11.5" font-weight="700" fill="#42505E" text-anchor="middle">quality/</text>
  <text x="680" y="859" font-size="10.5" fill="#68767F" text-anchor="middle">rapport pass/warn/fail</text>

  <!-- silver → job 2, and job 2's two outputs -->
  <g fill="none" stroke="#42505E" stroke-width="2.2" marker-end="url(#arrow)">
    <line x1="480" y1="546" x2="480" y2="674"/>
  </g>
  <text x="490" y="620" font-size="10.5" fill="#68767F">audite la partition</text>

  <g fill="none" stroke="#C7402C" stroke-width="2" marker-end="url(#arrowRed)">
    <polyline points="516,700 580,700 580,690 644,690"/>
    <polyline points="516,732 580,732 580,806 644,806"/>
  </g>

  <!-- the gate: gold is only built once the audit passes -->
  <g fill="none" stroke="#7A29FF" stroke-width="2.2" stroke-dasharray="7 4" marker-end="url(#arrowGold)">
    <polyline points="480,752 578,752 578,500 614,500"/>
  </g>
  <text x="586" y="746" font-size="10.5" font-weight="700" fill="#7A29FF">verdict = pass</text>
  <text x="586" y="760" font-size="10" fill="#7A29FF">sinon le gold n'est pas reconstruit</text>

  <!-- ═════════════ CLOUDWATCH ═════════════ -->
  <rect x="1174" y="676" width="72" height="72" rx="14" fill="url(#gIntegration)"/>
  <g stroke="#FFFFFF" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1192 722 l10 -14 l8 7 l12 -18"/>
  </g>
  <circle cx="1222" cy="697" r="3.6" fill="#FFFFFF"/>
  <text x="1210" y="772" font-size="13.5" font-weight="600" fill="#16202B" text-anchor="middle">Amazon CloudWatch</text>
  <text x="1210" y="788" font-size="11" fill="#68767F" text-anchor="middle">logs · métriques · alarmes</text>
  <text x="1210" y="803" font-size="11" fill="#68767F" text-anchor="middle">alimenté par les 2 λ et les 4 jobs</text>

  <g fill="none" stroke="#8A97A4" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowSoft)">
    <polyline points="1056,516 1100,516 1100,712 1168,712"/>
  </g>

  <!-- ═════════════ ORCHESTRATION ═════════════ -->
  <g fill="none" stroke="#8A97A4" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#arrowSoft)">
    <polyline points="1130,236 1130,340 1330,340 1330,470"/>
  </g>
  <text x="1140" y="332" font-size="10.5" fill="#68767F">orchestre les 5 jobs Glue</text>

  <text x="28" y="884" font-size="11" fill="#8A97A4">Médaillon : bronze (brut, rejouable) → silver (nettoyé, dédoublonné sur idempotency_key) → gold (une table par question). Le job 3 passe avant le job 4 : en amont de la publication c'est une barrière, en aval ce ne serait qu'un rapport.</text>
</svg>
