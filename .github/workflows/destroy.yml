name: Terraform Destroy

on:
workflow_dispatch:

jobs:
terraform-destroy:
runs-on: ubuntu-latest

```
steps:
  # ---------------------------------------------------------
  # Checkout Terraform repository
  # ---------------------------------------------------------
  - name: Checkout Terraform Repo
    uses: actions/checkout@v4
    with:
      repository: mohamedamine050/terraform-e-commerce-pipeline-ca3c8e62
      token: ${{ secrets.GH_TOKEN }}

  # ---------------------------------------------------------
  # Configure AWS credentials
  # ---------------------------------------------------------
  - name: Configure AWS Credentials
    uses: aws-actions/configure-aws-credentials@v4
    with:
      aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
      aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      aws-region: ${{ secrets.AWS_REGION }}

  # ---------------------------------------------------------
  # Install Terraform
  # ---------------------------------------------------------
  - name: Setup Terraform
    uses: hashicorp/setup-terraform@v3

  # =========================================================
  # BOOTSTRAP DESTROY
  # =========================================================

  - name: Bootstrap Terraform Init
    working-directory: bootstrap
    run: terraform init

  # ---------------------------------------------------------
  # Destroy main infrastructure first
  # ---------------------------------------------------------

  - name: Infrastructure Terraform Init
    working-directory: infra
    run: terraform init

  - name: Infrastructure Terraform Destroy
    working-directory: infra
    run: terraform destroy -auto-approve

  # =========================================================
  # BOOTSTRAP DESTROY
  # =========================================================

  - name: Bootstrap Terraform Destroy
    working-directory: bootstrap
    run: terraform destroy -auto-approve

  # ---------------------------------------------------------
  # Final verification
  # ---------------------------------------------------------

  - name: Verify AWS Resources
    if: always()
    run: |
      echo "======================================"
      echo "Terraform destroy process completed"
      echo "======================================"
      echo "Region: $AWS_REGION"
