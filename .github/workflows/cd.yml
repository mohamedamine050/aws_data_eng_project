name: CD Pipeline

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Data Repo
        uses: actions/checkout@v4
        with:
          repository: mohamedamine050/aws_data_eng_project
          token: ${{ secrets.GH_TOKEN }}

      - name: Checkout Terraform Repo
        uses: actions/checkout@v4
        with:
          repository: mohamedamine050/terraform-E-commerce-4b7d3bd5
          token: ${{ secrets.GH_TOKEN }}
          path: terraform

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform/infra
        run: |
          terraform init -input=false

      - name: Debug Terraform outputs
        working-directory: terraform/infra
        run: |
          terraform output

      - name: Get Terraform Outputs
        working-directory: terraform/infra
        run: |
          set -euo pipefail
          echo "CONFIG_PATH=s3://tfstate-e-commerce-ez2ogv30/config.json" >> "$GITHUB_ENV"


      - name: Build Glue dependencies
        run: |
          set -euo pipefail
          mkdir -p req
          if [ -s requirements.txt ]; then
            pip install -r requirements.txt -t req/ \
              --no-binary psycopg2-binary
          else
            echo "requirements.txt is empty or missing; skipping pip install"
          fi
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          req_dir = Path('req')
          with ZipFile('dependencies.zip', 'w', ZIP_DEFLATED) as archive:
              for path in req_dir.rglob('*'):
                  if path.is_file():
                      archive.write(path, path.relative_to(req_dir))
          PY

      - name: Upload dependencies to S3
        run: |
          aws s3 cp dependencies.zip s3://tfstate-e-commerce-ez2ogv30/dependencies.zip

      - name: Seed S3 data lake from data/
        run: |
          set -euo pipefail
          if [ -z "${CONFIG_PATH:-}" ]; then
            echo "CONFIG_PATH is not set; skipping data lake seeding"
            exit 0
          fi
          aws s3 cp "$CONFIG_PATH" /tmp/config.json
          OUTPUT_BUCKET=$(jq -r '.OUTPUT_BUCKET // empty' /tmp/config.json)
          if [ -z "$OUTPUT_BUCKET" ]; then
            echo "OUTPUT_BUCKET is empty in config.json; skipping data lake seeding"
            exit 0
          fi
          echo "Seeding s3://${OUTPUT_BUCKET} from data/"
          aws s3 sync "data/catalog" "s3://${OUTPUT_BUCKET}/catalog/"
          aws s3 sync "data/landing" "s3://${OUTPUT_BUCKET}/landing/"


      # ─── Lambda: ecommerce_producer (unmapped — upload only) ───
      - name: Package & upload Lambda ecommerce_producer
        run: |
          set -euo pipefail
          mkdir -p /tmp/dist
          (cd src/lambdas/ecommerce_producer && zip -r /tmp/dist/ecommerce_producer.zip . -x '__pycache__/*')
          BUCKET=$(cd terraform/infra && terraform output -raw scripts_bucket_name)
          aws s3 cp /tmp/dist/ecommerce_producer.zip "s3://$BUCKET/lambda/ecommerce_producer.zip"
          echo "⚠ ecommerce_producer: uploaded to s3://$BUCKET/lambda/ecommerce_producer.zip but no function mapping → code NOT updated"

      # ─── Lambda: stream_processor (unmapped — upload only) ───
      - name: Package & upload Lambda stream_processor
        run: |
          set -euo pipefail
          mkdir -p /tmp/dist
          (cd src/lambdas/stream_processor && zip -r /tmp/dist/stream_processor.zip . -x '__pycache__/*')
          BUCKET=$(cd terraform/infra && terraform output -raw scripts_bucket_name)
          aws s3 cp /tmp/dist/stream_processor.zip "s3://$BUCKET/lambda/stream_processor.zip"
          echo "⚠ stream_processor: uploaded to s3://$BUCKET/lambda/stream_processor.zip but no function mapping → code NOT updated"
