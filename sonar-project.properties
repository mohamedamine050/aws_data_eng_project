sonar.projectKey=mohamedamine050_aws_data_eng_project
sonar.organization=mohamedamine050

# Code analysé
sonar.sources=src
sonar.tests=tests

# Exclusions (important)
sonar.exclusions=infra/**,bootstrap/**,.github/**,**/*.tf

# Duplication — décision d'architecture, pas un oubli.
#
# Chaque script de src/jobs/ est autonome : ce que pointe le champ "Script path"
# d'un job Glue est la totalité de ce qu'il exécute, et --extra-py-files reste
# vide. Le prix est que la résolution des chemins du lac et l'émetteur de
# métriques existent en cinq exemplaires identiques, ce que le détecteur de
# copier-coller signale à juste titre — mais qui est ici voulu.
#
# Ce n'est pas laissé sans garde-fou : tests/test_job_self_containment.py vérifie
# que chaque copie résout exactement les mêmes chemins que common/lakehouse.py,
# sur quatre configurations différentes, et qu'aucun job n'importe quoi que ce
# soit du dépôt. Une divergence casse le build.
# Le motif doit matcher le chemin COMPLET d'un fichier : `src/jobs/**` ne
# couvre que des repertoires chez certains scanners, d'ou la forme `**/*`.
sonar.cpd.exclusions=src/jobs/**/*,**/src/jobs/**/*,src/jobs/*.py

# Coverage
sonar.python.coverage.reportPaths=coverage.xml
